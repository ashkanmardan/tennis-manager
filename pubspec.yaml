name: tennis_manager
description: مدیریت کلاس تنیس - Persian-first offline app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Database
  sqflite: ^2.3.0
  path: ^1.8.3

  # State Management
  provider: ^6.1.1

  # Persian Calendar
  shamsi_date: ^1.1.2

  # Image Picker (for payment receipts)
  image_picker: ^1.0.7

  # File/Backup
  path_provider: ^2.1.2
  share_plus: ^7.2.1
  file_picker: ^8.0.3

  # Permissions
  permission_handler: ^11.3.0

  # UI
  flutter_svg: ^2.0.10+1
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
