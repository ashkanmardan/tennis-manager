name: tennis_manager

description: دستیار شخصی بازیکن تنیس - Persian-first offline app

publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  sqflite: ^2.3.0
  path: ^1.8.3
  provider: ^6.1.1
  shamsi_date: ^1.1.1
  path_provider: ^2.1.2
  cupertino_icons: ^1.0.6
  url_launcher: ^6.2.5
  image_picker: ^1.0.7
  share_plus: ^7.2.2
  # file_picker removed — using getExternalStorageDirectory scan instead
  # flutter_local_notifications: ^17.0.0  # TODO: فعال‌سازی با VPN

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  sqflite_common_ffi: 2.4.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
