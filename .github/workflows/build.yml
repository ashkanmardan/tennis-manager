name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Create fresh Flutter project (for correct Android scaffold)
        run: |
          flutter create --org com.ashkan --project-name tennis_manager /tmp/tennis_scaffold
          echo "Flutter project created"

      - name: Copy our source code into scaffold
        run: |
          # Copy our lib, assets, pubspec
          cp -r lib /tmp/tennis_scaffold/
          cp pubspec.yaml /tmp/tennis_scaffold/

          # Copy android manifest and build files
          cp android/app/build.gradle /tmp/tennis_scaffold/android/app/build.gradle
          cp android/app/src/main/AndroidManifest.xml /tmp/tennis_scaffold/android/app/src/main/AndroidManifest.xml
          cp android/gradle.properties /tmp/tennis_scaffold/android/gradle.properties
          cp android/app/src/main/kotlin/com/ashkan/tennis_manager/MainActivity.kt \
             /tmp/tennis_scaffold/android/app/src/main/kotlin/com/ashkan/tennis_manager/MainActivity.kt || true

          # Download Vazirmatn font
          mkdir -p /tmp/tennis_scaffold/assets/fonts
          mkdir -p /tmp/tennis_scaffold/assets/images
          curl -L "https://github.com/rastikerdar/vazirmatn/releases/download/v33.003/vazirmatn-v33.003.zip" \
            -o /tmp/vazirmatn.zip
          unzip -j /tmp/vazirmatn.zip \
            "fonts/Vazirmatn-Regular.ttf" \
            "fonts/Vazirmatn-Medium.ttf" \
            "fonts/Vazirmatn-Bold.ttf" \
            -d /tmp/tennis_scaffold/assets/fonts/
          echo "Assets ready:"
          ls /tmp/tennis_scaffold/assets/fonts/

      - name: Flutter pub get
        working-directory: /tmp/tennis_scaffold
        run: flutter pub get

      - name: Build APK (release)
        working-directory: /tmp/tennis_scaffold
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tennis-manager-apk
          path: /tmp/tennis_scaffold/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
