name: Feature request
description: Suggest an improvement to the coaching workflow.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What task is difficult today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: usecase
    attributes:
      label: Use case
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
